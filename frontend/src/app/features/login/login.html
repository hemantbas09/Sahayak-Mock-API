<main class="login-screen">
  <form class="login-screen__card" (ngSubmit)="submitLogin()">
    <h1 class="login-screen__title">Sahayak</h1>
    <p class="login-screen__subtitle">Team Mock API Platform</p>

    @if (loginError(); as errorMessage) {
      <p class="login-screen__error" role="alert">{{ errorMessage }}</p>
    }

    <label class="login-screen__field">
      <span class="login-screen__label">Email</span>
      <input
        class="login-screen__input"
        type="email"
        name="email"
        required
        autocomplete="username"
        [ngModel]="emailInput()"
        (ngModelChange)="emailInput.set($event)"
      />
    </label>

    <label class="login-screen__field">
      <span class="login-screen__label">Password</span>
      <input
        class="login-screen__input"
        type="password"
        name="password"
        required
        autocomplete="current-password"
        [ngModel]="passwordInput()"
        (ngModelChange)="passwordInput.set($event)"
      />
    </label>

    <button class="login-screen__submit" type="submit" [disabled]="submitting()">
      @if (submitting()) { Signing in… } @else { Sign in }
    </button>

    <p class="login-screen__hint">
      Seeded admin: <code>admin@example.com</code> / <code>admin1234</code>
    </p>
  </form>
</main>
